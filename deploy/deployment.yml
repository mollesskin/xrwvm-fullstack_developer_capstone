apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dealership-mongo-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dealership-django-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealership-mongo
spec:
  replicas: 1
  selector:
    matchLabels: {app: dealership-mongo}
  template:
    metadata:
      labels: {app: dealership-mongo}
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports: [{containerPort: 27017}]
          volumeMounts: [{name: data, mountPath: /data/db}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: dealership-mongo-data}
---
apiVersion: v1
kind: Service
metadata:
  name: dealership-mongo
spec:
  selector: {app: dealership-mongo}
  ports: [{port: 27017, targetPort: 27017}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealership-api
spec:
  replicas: 1
  selector:
    matchLabels: {app: dealership-api}
  template:
    metadata:
      labels: {app: dealership-api}
    spec:
      containers:
        - name: api
          image: dealership-api:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 3030}]
          env:
            - {name: MONGO_URL, value: 'mongodb://dealership-mongo:27017/dealershipsDB'}
---
apiVersion: v1
kind: Service
metadata:
  name: dealership-api
spec:
  selector: {app: dealership-api}
  ports: [{port: 3030, targetPort: 3030}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealership-sentiment
spec:
  replicas: 1
  selector:
    matchLabels: {app: dealership-sentiment}
  template:
    metadata:
      labels: {app: dealership-sentiment}
    spec:
      containers:
        - name: sentiment
          image: dealership-sentiment:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 5050}]
---
apiVersion: v1
kind: Service
metadata:
  name: dealership-sentiment
spec:
  selector: {app: dealership-sentiment}
  ports: [{port: 5050, targetPort: 5050}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealership-web
spec:
  replicas: 1
  selector:
    matchLabels: {app: dealership-web}
  template:
    metadata:
      labels: {app: dealership-web}
    spec:
      containers:
        - name: web
          image: dealership-web:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          env:
            - {name: DJANGO_DEBUG, value: '0'}
            - {name: DJANGO_ALLOWED_HOSTS, value: '*'}
            - {name: DJANGO_DB_PATH, value: '/app/data/db.sqlite3'}
            - {name: BACKEND_URL, value: 'http://dealership-api:3030'}
            - {name: SENTIMENT_ANALYZER_URL, value: 'http://dealership-sentiment:5050'}
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: dealership-secrets, key: django-secret-key}
          volumeMounts: [{name: data, mountPath: /app/data}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: dealership-django-data}
---
apiVersion: v1
kind: Service
metadata:
  name: dealership-web
spec:
  type: NodePort
  selector: {app: dealership-web}
  ports: [{port: 8000, targetPort: 8000, nodePort: 30080}]
